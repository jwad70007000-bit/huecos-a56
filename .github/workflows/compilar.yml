name: Compilar APK

on:
  push:
    paths-ignore: [".github/workflows/aider.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon

      # main -> Release "ultima" (la APK buena).
      # Cualquier otra rama (p. ej. las de Aider) -> Release "prueba".
      - name: Publicar la APK en su Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            ETIQUETA=ultima; TITULO="Última versión"; PRE=""
          else
            ETIQUETA=prueba; TITULO="Prueba: $GITHUB_REF_NAME"; PRE="--prerelease"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk huecos-a56.apk
          gh release delete "$ETIQUETA" --cleanup-tag --yes || true
          sleep 3
          gh release create "$ETIQUETA" huecos-a56.apk $PRE \
            --target "$GITHUB_SHA" \
            --title "$TITULO" \
            --notes "APK compilada automáticamente desde $GITHUB_REF_NAME ($GITHUB_SHA)"
